name: Smoke checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check browser scripts
        run: |
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run runtime smoke test
        run: node tests/v58_health_smoke.js

      - name: Run persistence smoke test
        run: node tests/v58_persistence_smoke.js

      - name: Run darkness and torch smoke test
        run: node tests/v59_darkness_torch_smoke.js

      - name: Run old road smoke test
        run: node tests/v60_old_road_smoke.js

      - name: Run old road scale smoke test
        run: node tests/v60_2_old_road_scale_smoke.js

      - name: Run old road prop polish smoke test
        run: node tests/v60_3_old_road_prop_polish_smoke.js

      - name: Run Old Wayhouse smoke test
        run: node tests/v61_old_wayhouse_smoke.js

      - name: Run Wayhouse readability smoke test
        run: node tests/v61_1_wayhouse_readability_smoke.js

      - name: Run Wayhouse hearth and pot smoke test
        run: node tests/v62_wayhouse_pot_smoke.js

      - name: Run pot interaction fix smoke test
        run: node tests/v62_1_pot_interaction_fix_smoke.js

      - name: Run mounted pot fire visual smoke test
        run: node tests/v62_2_pot_fire_visual_smoke.js

      - name: Run contextual equipment smoke test
        run: node tests/v63_contextual_equipment_smoke.js
