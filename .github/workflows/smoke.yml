name: Smoke checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check browser scripts
        run: |
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run runtime smoke test
        run: node tests/v58_health_smoke.js

      - name: Run persistence smoke test
        run: node tests/v58_persistence_smoke.js

      - name: Run darkness and torch smoke test
        run: node tests/v59_darkness_torch_smoke.js

      - name: Run old road smoke test
        run: node tests/v60_old_road_smoke.js

      - name: Run old road scale smoke test
        run: node tests/v60_2_old_road_scale_smoke.js
