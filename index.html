<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Low Level Wizards</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="game-panel">
      <canvas id="gameCanvas"></canvas>

      <div class="hud hud-top-left" aria-label="Vitality">
        <span
          id="vitalityPips"
          class="vitality-pips"
          aria-label="Vitality 3 of 3"
        ></span>
      </div>

      <button
        id="overviewButton"
        class="overview-button"
        type="button"
        aria-label="Show full generated world"
      >
        World
      </button>

      <button
        id="seedMenuButton"
        class="seed-menu-button"
        type="button"
        aria-label="Open world seed tools"
        hidden
      >
        Seed
      </button>

      <div
        id="seedMenu"
        class="seed-menu"
        aria-label="World seed tools"
        hidden
      >
        <div class="seed-menu-heading">
          <span>World seed</span>
          <span id="currentSeedLabel" class="current-seed-label"></span>
        </div>

        <input
          id="seedInput"
          class="seed-input"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="World seed"
        />

        <div class="seed-menu-actions">
          <button id="applySeedButton" type="button">Use Seed</button>
          <button id="regenerateSeedButton" type="button">Again</button>
          <button id="randomSeedButton" type="button">Random</button>
        </div>

        <div class="debug-layer-buttons">
          <button
            id="moistureToggleButton"
            class="debug-layer-button"
            type="button"
            aria-pressed="false"
          >
            Moisture: Off
          </button>

          <button
            id="treeSuitabilityToggleButton"
            class="debug-layer-button"
            type="button"
            aria-pressed="false"
          >
            Trees: Off
          </button>

          <button
            id="canopyToggleButton"
            class="debug-layer-button"
            type="button"
            aria-pressed="false"
          >
            Canopy: Off
          </button>
        </div>
      </div>

      <div class="hud hud-top-right">
        <span id="turnStatus">Turn 0</span>
      </div>

      <div
        id="momentStatus"
        class="moment-status"
        aria-live="polite"
        hidden
      ></div>

      <div class="dpad" aria-label="Movement controls">
        <button class="move-button up" data-dx="0" data-dy="-1" aria-label="Move up">▲</button>
        <button class="move-button left" data-dx="-1" data-dy="0" aria-label="Move left">◀︎</button>
        <button class="move-button down" data-dx="0" data-dy="1" aria-label="Move down">▼</button>
        <button class="move-button right" data-dx="1" data-dy="0" aria-label="Move right">▶︎</button>
      </div>

      <div class="carry-hud">
        <div class="context-actions">
          <button
            id="pickupButton"
            class="context-action pickup-action"
            type="button"
            aria-label="Pick up item"
            hidden
          >
            Pick Up
          </button>

          <button
            id="dropButton"
            class="context-action drop-action"
            type="button"
            aria-label="Drop held item"
            hidden
          >
            Drop
          </button>

          <button
            id="useButton"
            class="context-action use-action"
            type="button"
            aria-label="Use held item or nearby thing"
            hidden
          >
            Use
          </button>

          <button
            id="restButton"
            class="context-action rest-action"
            type="button"
            aria-label="Rest by the fire"
            hidden
          >
            Rest
          </button>
        </div>

        <div class="pockets" aria-label="Pockets">
          <button class="pocket-slot" data-pocket="0" type="button" aria-label="Pocket 1"></button>
          <button class="pocket-slot" data-pocket="1" type="button" aria-label="Pocket 2"></button>
          <button class="pocket-slot" data-pocket="2" type="button" aria-label="Pocket 3"></button>
          <button class="pocket-slot" data-pocket="3" type="button" aria-label="Pocket 4"></button>
        </div>
      </div>
    </section>
  </main>

  <!-- Flat files on purpose: easy to edit from a phone, no module server required. -->
  <script src="game-data.js"></script>
  <script src="pcg.js"></script>
  <script src="hydrology.js"></script>
  <script src="moisture.js"></script>
  <script src="ecology.js"></script>
  <script src="landscape-geometry.js"></script>
  <script src="camera.js"></script>
  <script src="juice.js"></script>
  <script src="time.js"></script>
  <script src="vitality.js"></script>
  <script src="terrain.js"></script>
  <script src="systems.js"></script>
  <script src="fire.js"></script>
  <script src="foraging.js"></script>
  <script src="landscape-render.js"></script>
  <script src="render.js"></script>
  <script src="main.js"></script>
</body>
</html>
