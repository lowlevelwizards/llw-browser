<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Low Level Wizards</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="game-panel">
      <canvas id="gameCanvas"></canvas>

      <div class="hud hud-top-left" aria-label="Vitality">
        <span id="vitalityPips" class="vitality-pips" aria-label="Vitality 3 of 3"></span>
      </div>

      <div class="hud hud-top-right">
        <span id="turnStatus">Turn 0</span>
      </div>

      <div
        id="momentStatus"
        class="moment-status"
        aria-live="polite"
        hidden
      ></div>

      <div class="dpad" aria-label="Movement controls">
        <button class="move-button up" data-dx="0" data-dy="-1" aria-label="Move up">▲</button>
        <button class="move-button left" data-dx="-1" data-dy="0" aria-label="Move left">◀︎</button>
        <button class="move-button down" data-dx="0" data-dy="1" aria-label="Move down">▼</button>
        <button class="move-button right" data-dx="1" data-dy="0" aria-label="Move right">▶︎</button>
      </div>

      <div class="carry-hud">
        <div class="context-actions">
          <button
            id="actionButton"
            class="context-action pickup-action"
            type="button"
            aria-label="Pick up or drop"
            hidden
          >
            Pick Up
          </button>

          <button
            id="useButton"
            class="context-action use-action"
            type="button"
            aria-label="Use held item"
            hidden
          >
            Use
          </button>

          <button
            id="restButton"
            class="context-action rest-action"
            type="button"
            aria-label="Rest by the fire"
            hidden
          >
            Rest
          </button>
        </div>

        <div class="pockets" aria-label="Pockets">
          <button
            class="pocket-slot"
            data-pocket="0"
            type="button"
            aria-label="Pocket 1"
          ></button>
          <button
            class="pocket-slot"
            data-pocket="1"
            type="button"
            aria-label="Pocket 2"
          ></button>
        </div>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
