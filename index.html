<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>LLW HTML Experiment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="game-panel">
      <canvas id="gameCanvas"></canvas>
    </section>

    <section class="info-panel">
      <div class="info-copy">
        <h1>Low Level Wizards</h1>
        <p>Fifth brick: pockets can hold the little things you gather.</p>
      </div>

      <div class="dpad" aria-label="Movement controls">
        <button class="move-button up" data-dx="0" data-dy="-1" aria-label="Move up">▲</button>
        <button class="move-button left" data-dx="-1" data-dy="0" aria-label="Move left">◀︎</button>
        <button class="move-button down" data-dx="0" data-dy="1" aria-label="Move down">▼</button>
        <button class="move-button right" data-dx="1" data-dy="0" aria-label="Move right">▶︎</button>
      </div>

      <div class="carry-controls">
        <button
          id="actionButton"
          class="action-button"
          type="button"
          aria-label="Pick up or drop"
          disabled
        >
          Pick Up
        </button>

        <div class="pockets" aria-label="Pockets">
          <button
            class="pocket-slot"
            data-pocket="0"
            type="button"
            aria-label="Pocket 1"
          ></button>
          <button
            class="pocket-slot"
            data-pocket="1"
            type="button"
            aria-label="Pocket 2"
          ></button>
        </div>
      </div>

      <p class="control-hint">Move: arrows / WASD · Act: E / Space</p>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
